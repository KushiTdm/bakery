name: Tests Sauve Mie

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # Supabase de TEST — jamais la production
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SERVICE_ROLE_KEY }}
  # App
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  PLAYWRIGHT_BASE_URL: http://localhost:3000
  # Désactiver le rate limiting pendant les tests
  BYPASS_RATE_LIMIT: "true"
  # Secret interne pour les routes notifications (valeur de test)
  INTERNAL_API_SECRET: "test-secret-internal-32-chars-pad"
  # Désactiver la télémétrie Next.js
  NEXT_TELEMETRY_DISABLED: 1
  NODE_ENV: test

jobs:
  # ─── Job 1 : TypeScript check ──────────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

  # ─── Job 2 : Tests de sécurité (priorité haute) ────────────────────────────
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js
        run: npm run build

      - name: Start server
        run: npm start &

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run security tests
        run: npx playwright test tests/security/ --reporter=html,github

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30

  # ─── Job 3 : Tests unitaires et fonctionnels ───────────────────────────────
  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 40
    strategy:
      # Continuer les autres groupes même si l'un échoue
      fail-fast: false
      matrix:
        group:
          - name: "unit"
            dir: "tests/unit"
          - name: "auth"
            dir: "tests/auth"
          - name: "journee"
            dir: "tests/journee"
          - name: "stock"
            dir: "tests/stock"
          - name: "equipe"
            dir: "tests/equipe"
          - name: "penalites"
            dir: "tests/penalites"
          - name: "conservation"
            dir: "tests/conservation"
          - name: "ia"
            dir: "tests/ia"
          - name: "e2e"
            dir: "tests/e2e"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js
        run: npm run build

      - name: Start server
        run: npm start &

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run ${{ matrix.group.name }} tests
        run: npx playwright test ${{ matrix.group.dir }} --reporter=html,github

      - name: Upload ${{ matrix.group.name }} report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.group.name }}-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

  # ─── Résumé final ─────────────────────────────────────────────────────────
  tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [security-tests, functional-tests]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.security-tests.result }}" != "success" ]; then
            echo "❌ Security tests failed"
            exit 1
          fi
          if [ "${{ needs.functional-tests.result }}" != "success" ]; then
            echo "❌ Functional tests failed"
            exit 1
          fi
          echo "✅ All tests passed"