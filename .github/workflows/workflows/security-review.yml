name: AI Security Review (Gemini)

on:
  pull_request:
    paths:
      # Déclenché uniquement si des routes API ou de l'auth sont modifiées
      - "app/api/**/*.ts"
      - "lib/auth*.ts"
      - "lib/sanitize.ts"
      - "lib/rate-limit.ts"
      - "middleware.ts"
      - "proxy.ts"

jobs:
  gemini-security-review:
    name: Gemini Security Analysis
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Get changed API files
        id: changed
        run: |
          CHANGED=$(git diff HEAD~1 --name-only -- \
            'app/api/**' \
            'lib/auth*' \
            'lib/sanitize.ts' \
            'lib/rate-limit.ts' \
            'middleware.ts' \
            'proxy.ts' \
            | head -20 \
            | tr '\n' ',')
          echo "files=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed files: $CHANGED"

      - name: Run Gemini security analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/gemini-security-review.js

      - name: Post review comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('security-review.md')) {
              console.log('No review file generated, skipping comment');
              return;
            }
            const report = fs.readFileSync('security-review.md', 'utf8');
            if (!report.trim()) return;

            // Chercher et mettre à jour un commentaire existant plutôt qu'en créer un nouveau
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('🔒 Analyse Sécurité')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: report,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report,
              });
            }