# .github/workflows/playwright.yml
# CI/CD pour les tests Playwright
# ─────────────────────────────────────────────────────────────

name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Services (décommenter si base de données de test nécessaire)
    # services:
    #   postgres:
    #     image: postgres:15
    #     env:
    #       POSTGRES_PASSWORD: postgres
    #     ports:
    #       - 5432:5432

    env:
      # Variables d'environnement pour les tests
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      # Supabase test credentials (à configurer dans GitHub Secrets)
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_KEY }}
      # Clé API z.ai pour les tests (ou mock)
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      INTERNAL_API_SECRET: test-secret-internal

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: 🔨 Build application
        run: npm run build
        env:
          # Désactiver les optimisations pour accélérer le build de test
          NEXT_TELEMETRY_DISABLED: 1

      - name: 🧪 Run Playwright tests
        run: npx playwright test --reporter=html
        env:
          CI: true

      - name: 📊 Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: 📸 Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 7

  # Job optionnel pour les tests de régression visuelle
  visual-regression:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: 📸 Visual regression tests
        run: npx playwright test --project=chromium --grep "@visual"
        continue-on-error: true

  # Notification Slack/Discord (optionnel)
  notify:
    runs-on: ubuntu-latest
    needs: [test]
    if: failure() && github.event_name == 'push'
    
    steps:
      - name: 📢 Notify on failure
        run: |
          echo "Tests failed on ${{ github.ref }}"
          # Ajouter notification Slack/Discord ici si nécessaire